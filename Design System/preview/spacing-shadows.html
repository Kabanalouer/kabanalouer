<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Shadows</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; padding: 32px 24px; background: var(--birch-50); }
  .item { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .box {
    width: 100%; aspect-ratio: 1.1;
    background: var(--snow);
    border-radius: var(--radius-lg);
  }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: center; line-height: 1.4; }
  .lbl b { color: var(--fg-1); font-family: var(--font-sans); font-weight: 500; display: block; font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <div class="item"><div class="box" style="box-shadow: var(--shadow-xs);"></div><div class="lbl"><b>xs</b>hover fields</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-sm);"></div><div class="lbl"><b>sm</b>cards at rest</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-md);"></div><div class="lbl"><b>md</b>cards hover · dropdowns</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-lg);"></div><div class="lbl"><b>lg</b>modals · popovers</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-xl);"></div><div class="lbl"><b>xl</b>full sheets</div></div>
</div>
</body>
</html>
