<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Charcoal — Text &amp; Neutrals</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .grid { display: grid; grid-template-columns: 1.4fr repeat(9, 1fr); gap: 8px; }
  .hero {
    min-height: 132px;
    background: var(--char-800);
    color: var(--snow);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: var(--shadow-sm);
  }
  .hero .label { font-size: 11px; letter-spacing: var(--tracking-caps); text-transform: uppercase; opacity: 0.7; font-weight: 600; }
  .hero .name { font-family: var(--font-display); font-size: 32px; line-height: 1; letter-spacing: -0.035em; font-weight: 800; }
  .hero .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }
  .swatch { height: 132px; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="hero">
      <div class="label">Text · Charcoal</div>
      <div>
        <div class="name">Charcoal</div>
        <div class="hex">text · borders · neutrals</div>
      </div>
    </div>
    <div class="swatch light" style="background:var(--char-50); box-shadow: inset 0 0 0 1px var(--char-100)"><span class="name">50</span><span class="hex">#f7f7f7</span></div>
    <div class="swatch light" style="background:var(--char-100)"><span class="name">100</span><span class="hex">#ebebeb</span></div>
    <div class="swatch light" style="background:var(--char-200)"><span class="name">200</span><span class="hex">#dddddd</span></div>
    <div class="swatch light" style="background:var(--char-300)"><span class="name">300</span><span class="hex">#c4c4c4</span></div>
    <div class="swatch" style="background:var(--char-400)"><span class="name">400</span><span class="hex">#717171</span></div>
    <div class="swatch" style="background:var(--char-500)"><span class="name">500</span><span class="hex">#5e5e5e</span></div>
    <div class="swatch" style="background:var(--char-600)"><span class="name">600</span><span class="hex">#484848</span></div>
    <div class="swatch" style="background:var(--char-800); outline: 2px solid var(--coral-500); outline-offset: -2px"><span class="name">800</span><span class="hex">#222222</span></div>
    <div class="swatch" style="background:var(--char-900)"><span class="name">900</span><span class="hex">#111111</span></div>
  </div>
</div>
</body>
</html>
