<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Border Radii</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; align-items: end; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box {
    width: 100%; aspect-ratio: 1;
    background: var(--birch-100);
    box-shadow: inset 0 0 0 2px var(--forest-500), var(--shadow-xs);
    position: relative;
  }
  .box::after {
    content: '';
    position: absolute; inset: 8px;
    background: var(--snow);
    border-radius: inherit;
  }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: center; line-height: 1.3; }
  .lbl b { color: var(--fg-1); font-family: var(--font-sans); font-weight: 500; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="item"><div class="box" style="border-radius:4px;"></div><div class="lbl"><b>xs</b>4 px</div></div>
  <div class="item"><div class="box" style="border-radius:8px;"></div><div class="lbl"><b>sm</b>8 px</div></div>
  <div class="item"><div class="box" style="border-radius:12px;"></div><div class="lbl"><b>md</b>12 px</div></div>
  <div class="item"><div class="box" style="border-radius:16px;"></div><div class="lbl"><b>lg</b>16 px</div></div>
  <div class="item"><div class="box" style="border-radius:20px;"></div><div class="lbl"><b>xl</b>20 px</div></div>
  <div class="item"><div class="box" style="border-radius:28px;"></div><div class="lbl"><b>2xl</b>28 px</div></div>
  <div class="item"><div class="box" style="border-radius:999px;"></div><div class="lbl"><b>pill</b>full</div></div>
</div>
</body>
</html>
