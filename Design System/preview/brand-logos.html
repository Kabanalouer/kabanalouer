<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Logo Lockups</title>
<link rel="stylesheet" href="_card.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  .card { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; padding: 18px; align-items: stretch; }
  .lockup {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    border-radius: var(--radius-md);
    padding: 22px 18px;
    min-height: 200px;
  }
  .lockup.light  { background: var(--snow); border: 1px solid var(--char-100); }
  .lockup.alt    { background: var(--char-50); border: 1px solid var(--char-100); }
  .lockup.dark   { background: var(--char-800); }
  .lockup .wm {
    display: flex; align-items: center; gap: 14px;
  }
  .lockup .wm .name {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 38px;
    letter-spacing: -1.2px;
    line-height: 1;
  }
  .lockup.light .wm .name { color: var(--coral-500); }
  .lockup.dark  .wm .name { color: #ffffff; }
  .lockup img { display: block; }
  .lbl {
    font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-3);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .lockup.dark .lbl { color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
<div class="card">
  <div class="lockup light">
    <div class="wm">
      <img src="../assets/logo-mark.png" alt="cabin" style="height: 64px;" />
      <span class="name">kabanalouer</span>
    </div>
    <span class="lbl">wordmark · fond blanc</span>
  </div>
  <div class="lockup alt">
    <img src="../assets/favicon.png" alt="Kabanalouer favicon" style="height: 110px; border-radius: 20px;" />
    <span class="lbl">favicon · app icon (blanc sur coral)</span>
  </div>
  <div class="lockup dark">
    <div class="wm">
      <img src="../assets/logo-mark-white.png" alt="cabin" style="height: 64px;" />
      <span class="name">kabanalouer</span>
    </div>
    <span class="lbl">wordmark · fond foncé (tout blanc)</span>
  </div>
</div>
</body>
</html>
