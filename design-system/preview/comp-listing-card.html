<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Listing Card</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { padding: 24px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; background: var(--bg-page); }
  .listing { display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
  .photo {
    aspect-ratio: 4/3;
    border-radius: var(--radius-lg);
    background-size: cover;
    background-position: center;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .heart {
    position: absolute; top: 10px; right: 10px;
    width: 32px; height: 32px;
    border-radius: 999px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    color: var(--char-700);
    cursor: pointer;
  }
  .heart.on { color: var(--danger); }
  .heart.on svg { fill: var(--danger); }
  .badge {
    position: absolute; top: 12px; left: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--snow);
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    color: var(--char-800);
    letter-spacing: 0;
    box-shadow: var(--shadow-xs);
  }
  .dots {
    position: absolute; bottom: 10px; left: 0; right: 0;
    display: flex; gap: 4px; justify-content: center;
  }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.6); }
  .dot.on { background: var(--snow); }

  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .title { font-family: var(--font-sans); font-size: 15px; font-weight: 600; color: var(--fg-1); line-height: 1.3; }
  .rating { font-family: var(--font-sans); font-size: 13px; color: var(--fg-1); display: inline-flex; align-items: center; gap: 4px; }
  .rating .star { color: var(--ember-500); }
  .meta { font-family: var(--font-sans); font-size: 13px; color: var(--fg-3); line-height: 1.4; }
  .price { font-family: var(--font-sans); font-size: 14px; color: var(--fg-1); margin-top: 2px; }
  .price b { font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="listing">
    <div class="photo" style="background-image: linear-gradient(135deg, #5b8c65 0%, #356c81 100%);">
      <div class="badge">Coup de cœur</div>
      <div class="heart on">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="white" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
      </div>
      <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
    <div class="title-row">
      <span class="title">Chalet au bord du lac</span>
      <span class="rating"><span class="star">★</span> 4,92</span>
    </div>
    <div class="meta">Magog, Estrie · 8 voyageurs · 4 chambres</div>
    <div class="price"><b>240 $</b> /nuit · <span style="color: var(--fg-3);">720 $ total</span></div>
  </div>
  <div class="listing">
    <div class="photo" style="background-image: linear-gradient(135deg, #b9a482 0%, #c95a26 100%);">
      <div class="heart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
      </div>
      <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
    <div class="title-row">
      <span class="title">Refuge dans la forêt</span>
      <span class="rating"><span class="star">★</span> 4,87</span>
    </div>
    <div class="meta">Mont-Tremblant, Laurentides · 6 voyageurs · 3 chambres</div>
    <div class="price"><b>185 $</b> /nuit · <span style="color: var(--fg-3);">555 $ total</span></div>
  </div>
</div>
</body>
</html>
