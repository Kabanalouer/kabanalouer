<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Type Weights &amp; Mono</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; padding: 22px 24px; }
  .col h4 {
    font-family: var(--font-sans); font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3);
    margin: 0 0 10px;
  }
  .row { display: grid; grid-template-columns: 80px 1fr; gap: 12px; align-items: baseline; margin-bottom: 8px; }
  .row .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .sample { font-family: var(--font-sans); font-size: 22px; color: var(--fg-1); line-height: 1.1; letter-spacing: -0.02em; }
  .codeblock {
    font-family: var(--font-mono); font-size: 13px;
    background: var(--char-800); color: var(--snow);
    padding: 12px 14px; border-radius: var(--radius-md);
    line-height: 1.5;
  }
  .codeblock .k { color: var(--coral-300); }
  .codeblock .s { color: var(--teal-300); }
</style>
</head>
<body>
<div class="card">
  <div class="col">
    <h4>Plus Jakarta Sans · weights</h4>
    <div class="row"><span class="lbl">300</span><span class="sample" style="font-weight:300;">Kabanalouer</span></div>
    <div class="row"><span class="lbl">400</span><span class="sample" style="font-weight:400;">Kabanalouer</span></div>
    <div class="row"><span class="lbl">500</span><span class="sample" style="font-weight:500;">Kabanalouer</span></div>
    <div class="row"><span class="lbl">600</span><span class="sample" style="font-weight:600;">Kabanalouer</span></div>
    <div class="row"><span class="lbl">700</span><span class="sample" style="font-weight:700;">Kabanalouer</span></div>
    <div class="row"><span class="lbl">800</span><span class="sample" style="font-weight:800;">Kabanalouer</span></div>
  </div>
  <div class="col">
    <h4>Geist Mono</h4>
    <div class="codeblock">
<span class="k">code</span>: <span class="s">"KBN-87421"</span><br/>
<span class="k">prix</span>: <span class="s">240</span> <span class="k">$/nuit</span><br/>
<span class="k">arrivee</span>: <span class="s">"2026-07-18"</span>
    </div>
    <div style="margin-top:10px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); line-height: 1.5;">
      codes confirmation · dates ISO ·<br/>valeurs techniques (rare en UI)
    </div>
  </div>
</div>
</body>
</html>
