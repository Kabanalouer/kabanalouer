<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Type in Context</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { display: flex; flex-direction: column; gap: 8px; padding: 28px 24px; }
  .eyebrow { font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--coral-600); }
  .h1 { font-family: var(--font-display); font-size: 48px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; color: var(--fg-1); margin: 4px 0 0; }
  .h1 em { font-style: normal; color: var(--coral-500); }
  .lede { font-family: var(--font-body); font-size: 16px; line-height: 1.55; color: var(--fg-2); max-width: 540px; margin-top: 8px; }
  .meta { display: flex; gap: 14px; align-items: center; margin-top: 14px; font-family: var(--font-sans); font-size: 13px; color: var(--fg-3); }
  .meta b { color: var(--fg-1); font-weight: 700; }
  .star { color: var(--coral-500); }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Coup de cœur · Estrie</div>
  <h1 class="h1">Chalet en bois rond, au bord du lac <em>Memphrémagog</em>.</h1>
  <p class="lede">Un refuge pour 8 voyageurs avec spa, foyer au bois et accès direct à la plage privée. À 1 h 30 de Montréal.</p>
  <div class="meta">
    <span><b>240 $</b> /nuit</span>
    <span>·</span>
    <span><span class="star">★</span> <b>4,92</b> (87 avis)</span>
    <span>·</span>
    <span>Magog, Estrie</span>
  </div>
</div>
</body>
</html>
