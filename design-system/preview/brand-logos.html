<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Logo Lockups</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; padding: 18px; align-items: stretch; }
  .lockup {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    border-radius: var(--radius-md);
    padding: 22px 18px;
    min-height: 200px;
  }
  .lockup.light  { background: var(--snow); border: 1px solid var(--char-100); }
  .lockup.alt    { background: var(--char-50); border: 1px solid var(--char-100); }
  .lockup.dark   { background: var(--char-800); }
  .lockup img { display: block; max-width: 100%; }
  .lbl {
    font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-3);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .lockup.dark .lbl { color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
<div class="card">
  <div class="lockup light">
    <img src="../assets/logo-wordmark.svg" alt="Kabanalouer wordmark" style="height: 52px;" />
    <span class="lbl">wordmark · fond blanc</span>
  </div>
  <div class="lockup alt">
    <img src="../assets/logo-mark.svg" alt="Kabanalouer mark" style="height: 80px;" />
    <span class="lbl">mark · favicon · app icon</span>
  </div>
  <div class="lockup dark">
    <img src="../assets/logo-wordmark-light.svg" alt="Kabanalouer wordmark light" style="height: 52px;" />
    <span class="lbl">wordmark · fond foncé</span>
  </div>
</div>
</body>
</html>
