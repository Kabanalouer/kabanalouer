<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Motion — Easing & Durations</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { display: flex; flex-direction: column; gap: 14px; padding: 22px 24px; }
  .head { font-family: var(--font-sans); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .item { background: var(--snow); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-xs); display: flex; flex-direction: column; gap: 6px; }
  .item .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .item .name { font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--fg-1); }
  .item .val { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); margin-top: auto; }
  .track {
    position: relative; height: 28px;
    background: var(--birch-100); border-radius: 999px; overflow: hidden;
  }
  .ball {
    position: absolute; top: 4px; left: 4px;
    width: 20px; height: 20px;
    border-radius: 999px;
    background: var(--forest-500);
    animation-duration: 1.8s;
    animation-iteration-count: infinite;
    animation-direction: alternate;
    animation-name: slide;
  }
  .b1 { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  .b2 { animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
  .b3 { animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); background: var(--ember-500); }
  @keyframes slide { from { left: 4px; } to { left: calc(100% - 24px); } }

  .durs { display: flex; gap: 16px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .durs span { display: flex; gap: 6px; }
  .durs b { font-family: var(--font-sans); color: var(--fg-1); }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="item">
      <div class="name">ease-out</div>
      <div class="track"><div class="ball b1"></div></div>
      <div class="val">cubic-bezier(.22, 1, .36, 1)</div>
    </div>
    <div class="item">
      <div class="name">ease-in-out</div>
      <div class="track"><div class="ball b2"></div></div>
      <div class="val">cubic-bezier(.65, 0, .35, 1)</div>
    </div>
    <div class="item">
      <div class="name">ease-spring</div>
      <div class="track"><div class="ball b3"></div></div>
      <div class="val">cubic-bezier(.34, 1.56, .64, 1)</div>
    </div>
  </div>
  <div class="durs">
    <span><b>fast</b> 140 ms</span>
    <span>·</span>
    <span><b>base</b> 220 ms</span>
    <span>·</span>
    <span><b>slow</b> 360 ms</span>
    <span>·</span>
    <span><b>slower</b> 540 ms</span>
  </div>
</div>
</body>
</html>
